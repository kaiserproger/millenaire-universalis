java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

dependencies {
    compileOnly files(rootProject.file('../mods/millenaire-9.0.0-beta.2.jar'))

    // Opt-in only: load the assembled client/server content while exercising the real UI against
    // the dedicated server.  Production artifacts remain unchanged and the source-set armies mod
    // is deliberately not duplicated by the deployed JAR.
    if (rootProject.findProperty('fullClientSmoke') == 'true') {
        runtimeOnly fileTree(rootProject.file('../mods')) {
            include '*.jar'
            exclude 'millenaire_armies-*.jar'
            exclude 'sarvaroptimizer_*.jar'
            exclude 'neoforge-carpet-*.jar'
        }
        // Client render optimizers are intentionally omitted here: UserDev places file
        // dependencies on its transformation classpath instead of a normal mods directory, which
        // makes Sodium look like a library to FML.  The distributable client tests those JARs in a
        // regular instance; this run is for the addon UI and synced registries.
    }
}

tasks.register('runLogisticsSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs the deterministic fixed-storage strategic logistics self-test.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ru.kaiserroman.millenairearmies.server.logistics.StrategicLogisticsEngineSelfTest'
    jvmArgs '-ea'
    dependsOn classes
}

