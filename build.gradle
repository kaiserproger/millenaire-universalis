tasks.register('validateArmyUiResources', JavaExec) {
    group = 'verification'
    description = 'Checks paired locales, literal UI keys, blank values and unfinished resource text.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ru.kaiserroman.millenairearmies.client.ui.ArmyUiResourceSelfTest'
    args file('src/main/resources/assets/millenaire_armies/lang/en_us.json').absolutePath,
            file('src/main/resources/assets/millenaire_armies/lang/ru_ru.json').absolutePath,
            file('src/main/java').absolutePath
    jvmArgs '-ea'
    dependsOn classes
}

tasks.named('check') {
    dependsOn 'runArmyUiStateSelfTest', 'validateArmyUiResources'
}

