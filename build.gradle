plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    maven {
        name = 'bundledKernels'
        url = uri(rootProject.file('local-maven'))
        content {
            includeGroup 'ru.kaiserroman.millenaire'
        }
    }
}

configurations {
    embeddedKernels
    implementation.extendsFrom embeddedKernels
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    embeddedKernels "ru.kaiserroman.millenaire:millenaire-realm:${realm_version}"
    embeddedKernels "ru.kaiserroman.millenaire:millenaire-simulation:${simulation_version}"
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_description        : mod_description,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar', Jar).configure {
    from({
        configurations.embeddedKernels.collect { dependency -> zipTree(dependency) }
    }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

dependencies {
    compileOnly files(rootProject.file('vendor/millenaire-9.0.0-beta.2.jar'))

    // Opt-in only: load the assembled client/server content while exercising the real UI against
    // the dedicated server.  Production artifacts remain unchanged and the source-set armies mod
    // is deliberately not duplicated by the deployed JAR.
    if (rootProject.findProperty('fullClientSmoke') == 'true') {
        runtimeOnly fileTree(rootProject.file('vendor')) {
            include '*.jar'
            exclude 'millenaire_armies-*.jar'
            exclude 'sarvaroptimizer_*.jar'
            exclude 'neoforge-carpet-*.jar'
        }
        // The dedicated visual battle fixture uses Carpet's server-side fake-player command.
        // Load the exact same test-only JAR on the UserDev client so NeoForge's BOTH-side mod
        // handshake remains symmetrical; it is never packaged into the Armies artifact.
        runtimeOnly files(
                rootProject.file(
                        'qa/full-cycle/runs/codex-armies-20260803-2345/server/mods/neoforge-carpet-1.21.1-1.0.8+v251027.jar'),
                rootProject.file(
                        'qa/full-cycle/runs/codex-armies-20260803-2345/server/mods/pandalib-neoforge-1.21.1-0.6.0.jar'),
                rootProject.file(
                        'qa/full-cycle/runs/codex-armies-20260803-2345/server/mods/sarvaroptimizer_compat-1.0.0.jar'),
                rootProject.file(
                        'qa/full-cycle/runs/codex-armies-20260803-2345/server/mods/sarvaroptimizer_millenaire-1.0.0.jar'),
                rootProject.file(
                        'qa/full-cycle/runs/codex-armies-20260803-2345/server/mods/sarvaroptimizer_nms-1.0.0.jar'))
        // Client render optimizers are intentionally omitted here: UserDev places file
        // dependencies on its transformation classpath instead of a normal mods directory, which
        // makes Sodium look like a library to FML.  The distributable client tests those JARs in a
        // regular instance; this run is for the addon UI and synced registries.
    }
}

